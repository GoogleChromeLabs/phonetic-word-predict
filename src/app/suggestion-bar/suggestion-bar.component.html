<div class="input-container" [class.visible]="isInputVisible">
  <input #manualInput type="text" class="manual-input" [placeholder]="chrome.i18n.getMessage('typeForSuggestions')"
    (input)="onManualInput()" (mousedown)="$event.stopPropagation()" />
</div>

<div class="suggestion-outer-container"
     (mousedown)="onDragStart($event)">

  <div class="drag-handle" [title]="chrome.i18n.getMessage('dragHandle')">{{ chrome.i18n.getMessage('dragHandleIcon') }}</div>

  @if (isLoading) {
    <div class="loading-indicator">
      <div class="spinner"></div>
      </div>
  }

  @if (!isLoading && suggestions.length > 0) {
    <div class="suggestion-container">
      @for (suggestion of suggestions; track suggestion) { <span
          class="suggestion-item"
          (click)="selectWord(suggestion)"
          (mousedown)="$event.stopPropagation()"
          [title]="chrome.i18n.getMessage('clickToCopy')"> {{ suggestion }}
        </span>
      }
    </div>
  } @else if (!isLoading && suggestions.length === 0 && !isInputVisible) {
      <div class="no-suggestions-placeholder"></div>
  }

  <div class="button-group">
    <button class="icon-button toggle-button" (click)="toggleInput()" (mousedown)="$event.stopPropagation()"
      [title]="chrome.i18n.getMessage('toggleManualInput')">
      {{ isInputVisible ? '▲' : '▼' }}
    </button>
    <button class="icon-button dismiss-button" (click)="dismiss()" [title]="chrome.i18n.getMessage('dismissSuggestions')">
      &times;
    </button>
  </div>

</div>
